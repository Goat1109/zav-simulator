%YAML:1.0

#--------------------------------------------------------------------------------------------
# Zenith Drone - Hikrobot MV-CU013-A0UC Camera Configuration
#--------------------------------------------------------------------------------------------

# Serial number (leave blank or comment if single camera)
# SerialNumber: "DA7036691"

# Topic Name published to ROS 2
TopicName: "/camera/image_raw"

# Hardware Trigger: 0 for Free-run (Continuous USB), 1 for Hardware Pin Trigger
TriggerEnable: 0

# Capture full resolution for the recorder; keep navigation matched to LiDAR.
FrameRate: 30.0
RawFrameRate: 10.0
RecordingTopic: "/camera/full/image_raw/compressed"
JpegQuality: 85

# Exposure Settings
# ExposureAutoMode: 0 = Off, 1 = Once, 2 = Continuous
ExposureAutoMode: 2
ExposureTime: 15000 # us (used when ExposureAutoMode is 0)
AutoExposureTimeLower: 500
AutoExposureTimeUpper: 10000 # us; limit motion blur during flight

# Image & Gain Settings
Binning: 1          # Preserve the full Bayer mosaic for colour reconstruction
image_scale: 0.5    # Downsample RGB after demosaicing to the calibrated 640x512
GainAuto: 2        # 0 = Off, 1 = Once, 2 = Continuous
Gain: 6.0         # Used only when GainAuto is 0 (manual gain in dB)
Gamma: 0.7         # Used only when GammaSelector is 1 (User)
GammaSelector: 1   # MVS SDK values: 1 = User, 2 = fixed sRGB curve

# Pixel Format: 0: RGB8, 1: BayerRG8, 2: BayerRG12Packed, 3: BayerGB12Packed, 4: BayerGB8
PixelFormat: 4
